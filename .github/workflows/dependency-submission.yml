name: Dependency submission

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  submit:
    name: Submit dependency graph
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/dependency-submission@v6
